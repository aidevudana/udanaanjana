<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750">
  <defs>
    <linearGradient id="bg11" x1="0" y1="0" x2="1000" y2="750" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#12101f"/>
      <stop offset="1" stop-color="#010d16"/>
    </linearGradient>
    <radialGradient id="glow11" cx="0.4" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#8a6bff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#8a6bff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1000" height="750" fill="url(#bg11)"/>
  <rect width="1000" height="750" fill="url(#glow11)"/>

  <!-- faint grid -->
  <g stroke="#26243d" stroke-width="1" opacity="0.5">
    <line x1="0" y1="150" x2="1000" y2="150"/>
    <line x1="0" y1="300" x2="1000" y2="300"/>
    <line x1="0" y1="450" x2="1000" y2="450"/>
    <line x1="0" y1="600" x2="1000" y2="600"/>
    <line x1="250" y1="0" x2="250" y2="750"/>
    <line x1="500" y1="0" x2="500" y2="750"/>
    <line x1="750" y1="0" x2="750" y2="750"/>
  </g>

  <!-- single-camera scope lens -->
  <circle cx="400" cy="375" r="180" fill="none" stroke="#8a6bff" stroke-width="2" opacity="0.55"/>
  <circle cx="400" cy="375" r="140" fill="none" stroke="#8a6bff" stroke-width="1.5" opacity="0.4"/>
  <circle cx="400" cy="375" r="95" fill="#8a6bff" opacity="0.07"/>
  <circle cx="400" cy="375" r="95" fill="none" stroke="#8a6bff" stroke-width="2"/>
  <circle cx="400" cy="375" r="46" fill="#0b0a16" stroke="#c8bcff" stroke-width="2"/>
  <circle cx="400" cy="375" r="14" fill="#c8bcff" opacity="0.85"/>

  <!-- crosshair -->
  <g stroke="#c8bcff" stroke-width="1.5" opacity="0.7">
    <line x1="400" y1="150" x2="400" y2="230"/>
    <line x1="400" y1="520" x2="400" y2="600"/>
    <line x1="150" y1="375" x2="230" y2="375"/>
    <line x1="570" y1="375" x2="650" y2="375"/>
  </g>

  <!-- measurement calipers -->
  <g stroke="#3ddc84" stroke-width="2.5">
    <line x1="620" y1="290" x2="620" y2="460"/>
    <line x1="600" y1="290" x2="640" y2="290"/>
    <line x1="600" y1="460" x2="640" y2="460"/>
    <line x1="620" y1="290" x2="820" y2="230"/>
    <line x1="620" y1="460" x2="820" y2="520"/>
  </g>
  <rect x="810" y="345" width="120" height="60" rx="6" fill="#0b0a16" stroke="#3ddc84" stroke-width="1"/>
  <text x="870" y="372" font-family="Arial, sans-serif" font-size="15" fill="#3ddc84" text-anchor="middle" font-weight="600">Uterine</text>
  <text x="870" y="392" font-family="Arial, sans-serif" font-size="15" fill="#3ddc84" text-anchor="middle" font-weight="600">size est.</text>

  <!-- label -->
  <text x="60" y="90" font-family="Arial, sans-serif" font-size="30" fill="#e7f6ff" font-weight="700">AI Measurement Concept</text>
  <text x="60" y="122" font-family="Arial, sans-serif" font-size="17" fill="#a89bd6">Single-camera laparoscopy sizing</text>
</svg>
